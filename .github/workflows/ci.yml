name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 #6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Kantela.sln -c Release -p:Platform=${{ matrix.platform }}

      # Kantela.Core is platform-independent, so tests run only once.
      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Kantela.Core.Tests/Kantela.Core.Tests.csproj -c Release
